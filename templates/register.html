<!DOCTYPE html>
<html>
<head>
  <title>Crown Markets - Create Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a2a4a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(20, 30, 48, 0.8);
      border: 1px solid rgba(74, 158, 255, 0.2);
      border-radius: 12px;
      padding: 50px 40px;
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(10px);
    }
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo-text span {
      color: #4a9eff;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(74, 158, 255, 0.2);
      background: rgba(10, 20, 40, 0.6);
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    input::placeholder {
      color: #555;
    }
    input:focus {
      outline: none;
      border-color: #4a9eff;
      background: rgba(10, 20, 40, 0.8);
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.1);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .btn {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #4a9eff 0%, #2a7eef 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(74, 158, 255, 0.2);
      margin-top: 10px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #6aafff 0%, #4a8eff 100%);
      box-shadow: 0 6px 20px rgba(74, 158, 255, 0.3);
      transform: translateY(-2px);
    }
    .error {
      background: rgba(255, 69, 96, 0.15);
      border: 1px solid rgba(255, 69, 96, 0.3);
      color: #ff6b7a;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }
    .success {
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #81c784;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }
    .login-link a {
      color: #4a9eff;
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      color: #6aafff;
      text-decoration: underline;
    }
    .terms {
      font-size: 11px;
      color: #666;
      line-height: 1.6;
      margin-top: 15px;
      text-align: center;
    }
    .terms a {
      color: #4a9eff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">👑</div>
      <div class="logo-text">Crown <span>Markets</span></div>
    </div>
    <div class="subtitle">Create Your Trading Account</div>
    <div class="error" id="err"></div>
    <div class="success" id="succ"></div>
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="john@example.com">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="+254 712 345 678">
      </div>
      <div class="form-group">
        <label>PIN (6 digits)</label>
        <input type="password" id="pin" placeholder="000000" maxlength="6">
      </div>
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="pass" placeholder="Min. 8 characters">
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="pass2" placeholder="Confirm your password">
    </div>
    
    <button class="btn" onclick="register()">Create Account</button>
    
    <div class="terms">
      By creating an account, you agree to our Terms of Service. This is a simulated trading platform for educational purposes.
    </div>
    
    <p class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>

  <script>
    async function register() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value;
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;
      const errEl = document.getElementById('err');
      const succEl = document.getElementById('succ');
      
      errEl.style.display = 'none';
      succEl.style.display = 'none';
      
      if (!name || !email || !phone || !pin || !pass || !pass2) {
        errEl.innerHTML = 'All fields are required';
        errEl.style.display = 'block';
        return;
      }
      
      if (pass.length < 8) {
        errEl.innerHTML = 'Password must be at least 8 characters';
        errEl.style.display = 'block';
        return;
      }
      
      if (pass !== pass2) {
        errEl.innerHTML = 'Passwords do not match';
        errEl.style.display = 'block';
        return;
      }
      
      if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
        errEl.innerHTML = 'PIN must be exactly 6 digits';
        errEl.style.display = 'block';
        return;
      }
      
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, email, phone, pin, password: pass, admin: false
          })
        });
        const d = await r.json();
        if (d.success) {
          succEl.innerHTML = 'Account created! Redirecting to login...';
          succEl.style.display = 'block';
          setTimeout(() => { window.location = '/login'; }, 2000);
        } else {
          errEl.innerHTML = d.error || 'Registration failed. Please try again.';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.innerHTML = 'Connection error. Please try again.';
        errEl.style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
  </script>
</body>
</html>
