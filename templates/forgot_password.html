<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crown Markets - Reset Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-gold: #d4af37;
      --gold-bright: #f0d96e;
      --dark-bg: #0a0e27;
      --card-bg: #1a1f3a;
      --field-bg: #10142c;
      --accent-green: #00ff41;
      --accent-red: #ff5c5c;
      --text-light: #e8e8e8;
      --text-muted: #8f93ab;
      --border-subtle: rgba(212, 175, 55, 0.18);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(ellipse at top, #131938 0%, var(--dark-bg) 55%, #060811 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .card {
      background: linear-gradient(180deg, rgba(26, 31, 58, 0.96), rgba(20, 24, 46, 0.92));
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px 32px 28px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(212, 175, 55, 0.08);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: rgba(212, 175, 55, 0.32);
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .logo-image {
      max-width: 64px;
      height: auto;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-gold), var(--gold-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .brand-tagline {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--text-light);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .subtitle-sub {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* Alerts */
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.4;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error {
      background: rgba(255, 92, 92, 0.1);
      border: 1px solid rgba(255, 92, 92, 0.3);
      color: var(--accent-red);
    }

    .success {
      background: rgba(0, 255, 65, 0.1);
      border: 1px solid rgba(0, 255, 65, 0.3);
      color: var(--accent-green);
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .field-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border-subtle);
      background: var(--field-bg);
      color: var(--text-light);
      border-radius: 8px;
      font-size: 13px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      font-family: inherit;
    }

    input::placeholder {
      color: rgba(143, 147, 171, 0.5);
    }

    input:focus {
      outline: none;
      border-color: var(--primary-gold);
      background: #0c1030;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    input.field-invalid {
      border-color: rgba(255, 92, 92, 0.55);
    }

    /* Button */
    .btn {
      width: 100%;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--primary-gold), var(--gold-bright));
      color: var(--dark-bg);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.28);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--gold-bright), var(--primary-gold));
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0px);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(10, 14, 39, 0.35);
      border-top-color: var(--dark-bg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Links */
    .back-link {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .back-link a {
      color: var(--primary-gold);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .back-link a:hover {
      color: var(--gold-bright);
      text-decoration: underline;
    }

    /* Info Text */
    .info {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .card {
        padding: 24px 20px 20px;
        border-radius: 12px;
        max-width: 100%;
      }

      .brand-name {
        font-size: 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      .logo-image {
        max-width: 56px;
      }

      .subtitle {
        font-size: 13px;
      }
    }

    /* Accessibility: visible focus for keyboard users */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary-gold);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-image { animation: none; }
      .btn, .card, input { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Logo Section -->
      <div class="logo-section">
        <img src="/static/logo.png" alt="Crown Markets" class="logo-image">
        <div class="brand-name">Crown Markets</div>
        <div class="brand-tagline">Trade Global • Invest Smart • Grow With Confidence</div>
      </div>

      <div class="subtitle">Reset your password</div>
      <div class="subtitle-sub">Verify your identity to set a new password</div>

      <!-- Alerts -->
      <div class="alert error" id="err" role="alert"></div>
      <div class="alert success" id="ok" role="status"></div>

      <form id="resetForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus>
        </div>

        <!-- Phone & PIN Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+254 712 345678" autocomplete="tel" required>
          </div>
          <div class="form-group">
            <label for="pin">PIN (6 digits)</label>
            <input type="password" id="pin" name="pin" placeholder="••••••" inputmode="numeric" maxlength="6" autocomplete="off" required>
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label for="new_password">New password</label>
          <input type="password" id="new_password" name="new_password" placeholder="Min. 8 characters" autocomplete="new-password" required>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" autocomplete="new-password" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn" id="resetBtn">
          <span id="btnLabel">Reset password</span>
          <span class="spinner" id="btnSpinner"></span>
        </button>
      </form>

      <!-- Info -->
      <div class="info">
        Enter the email and phone number associated with your account, along with your PIN.
      </div>

      <!-- Back Link -->
      <p class="back-link">
        <a href="/">← Back to login</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('resetForm');
      const errEl = document.getElementById('err');
      const okEl = document.getElementById('ok');
      const btnEl = document.getElementById('resetBtn');
      const btnLabel = document.getElementById('btnLabel');
      const btnSpinner = document.getElementById('btnSpinner');

      const fields = {
        email: document.getElementById('email'),
        phone: document.getElementById('phone'),
        pin: document.getElementById('pin'),
        new_password: document.getElementById('new_password'),
        confirm_password: document.getElementById('confirm_password')
      };

      // Clear invalid state as the user types
      Object.values(fields).forEach(f => {
        f.addEventListener('input', () => f.classList.remove('field-invalid'));
      });

      // Digits-only PIN
      fields.pin.addEventListener('input', () => {
        fields.pin.value = fields.pin.value.replace(/\D/g, '').slice(0, 6);
      });

      function showError(message, invalidFields = []) {
        errEl.textContent = '✗ ' + message;
        errEl.style.display = 'flex';
        okEl.style.display = 'none';
        invalidFields.forEach(f => fields[f]?.classList.add('field-invalid'));
      }

      function clearAlerts() {
        errEl.style.display = 'none';
        okEl.style.display = 'none';
      }

      function setLoading(isLoading) {
        btnEl.disabled = isLoading;
        btnLabel.textContent = isLoading ? 'Resetting password…' : 'Reset password';
        btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlerts();

        const email = fields.email.value.trim();
        const phone = fields.phone.value.trim();
        const pin = fields.pin.value;
        const newPassword = fields.new_password.value;
        const confirmPassword = fields.confirm_password.value;

        // Validation
        if (!email || !phone || !pin || !newPassword || !confirmPassword) {
          showError('All fields are required');
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Please enter a valid email address', ['email']);
          return;
        }

        if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
          showError('PIN must be exactly 6 digits', ['pin']);
          return;
        }

        if (newPassword.length < 8) {
          showError('Password must be at least 8 characters', ['new_password']);
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('Passwords do not match', ['new_password', 'confirm_password']);
          return;
        }

        setLoading(true);

        try {
          const r = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              email, 
              phone, 
              pin, 
              new_password: newPassword 
            })
          });

          const d = await r.json();

          if (r.ok && d.success) {
            okEl.textContent = '✓ Password reset successfully. Redirecting…';
            okEl.style.display = 'flex';
            setTimeout(() => { window.location.href = '/'; }, 1800);
          } else {
            showError(d.error || 'Password reset failed. Please try again.');
            setLoading(false);
          }
        } catch (err) {
          showError('Connection error. Please check your network and try again.');
          setLoading(false);
        }
      });

      // Allow Enter to submit
      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
      });
    })();
  </script>
</body>
</html>
