<!DOCTYPE html>
<html>
<head>
  <title>Crown Markets - Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a2a4a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
    }
    .card {
      background: rgba(20, 30, 48, 0.9);
      border: 1px solid rgba(74, 158, 255, 0.25);
      border-radius: 8px;
      padding: 28px 32px;
      backdrop-filter: blur(10px);
    }
    .logo {
      text-align: center;
      margin-bottom: 22px;
    }
    .logo-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .logo-text span {
      color: #4a9eff;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #777;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(74, 158, 255, 0.2);
      background: rgba(10, 20, 40, 0.7);
      color: #fff;
      border-radius: 5px;
      font-size: 13px;
      transition: all 0.3s ease;
    }
    input::placeholder {
      color: #666;
    }
    input:focus {
      outline: none;
      border-color: #4a9eff;
      background: rgba(10, 20, 40, 0.85);
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.15);
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 11px;
      margin-top: 6px;
      margin-bottom: 16px;
    }
    .forgot-link a {
      color: #4a9eff;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .forgot-link a:hover {
      color: #6aafff;
      text-decoration: underline;
    }
    .btn {
      width: 100%;
      padding: 10px 18px;
      background: linear-gradient(135deg, #4a9eff 0%, #2a7eef 100%);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(74, 158, 255, 0.2);
    }
    .btn:hover {
      background: linear-gradient(135deg, #6aafff 0%, #4a8eff 100%);
      box-shadow: 0 5px 16px rgba(74, 158, 255, 0.3);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .error {
      background: rgba(255, 69, 96, 0.15);
      border: 1px solid rgba(255, 69, 96, 0.3);
      color: #ff6b7a;
      padding: 10px 12px;
      border-radius: 5px;
      margin-bottom: 14px;
      display: none;
      font-size: 12px;
    }
    .signup-link {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }
    .signup-link a {
      color: #4a9eff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .signup-link a:hover {
      color: #6aafff;
    }
    .divider {
      color: #555;
      margin: 0 6px;
    }
    .admin-link {
      color: #4a9eff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .admin-link:hover {
      color: #6aafff;
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 24px 24px;
      }
      .logo-text {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">👑</div>
        <div class="logo-text">Crown <span>Markets</span></div>
      </div>
      <div class="subtitle">Trading Platform</div>
      <div class="error" id="err"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@example.com" autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      <button class="btn" onclick="login()">Sign In</button>
      <p class="signup-link">
        <a href="/register">Sign up</a>
        <span class="divider">|</span>
        <a href="/admin" class="admin-link">Admin</a>
      </p>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const errEl = document.getElementById('err');
      
      if (!email || !pass) {
        errEl.innerHTML = 'Please enter email and password';
        errEl.style.display = 'block';
        return;
      }
      
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass, admin: false })
        });
        const d = await r.json();
        if (d.success) {
          window.location = d.data.redirect;
        } else {
          errEl.innerHTML = d.error || 'Login failed';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.innerHTML = 'Connection error';
        errEl.style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
